<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; background: #000; }
        #timeLabel {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-family: sans-serif;
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="timeLabel">Loading radar…</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function initRadar(lat, lon) {
            var map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat, lon], 7);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            L.marker([lat, lon]).addTo(map);

            var radarLayer = null;
            var frames = [];
            var frameIndex = 0;
            var timer = null;

            function showFrame(i) {
                var frame = frames[i];
                if (!frame) return;
                var newLayer = L.tileLayer(frame.url, { opacity: 0.75, zIndex: 10 });
                newLayer.addTo(map);
                if (radarLayer) {
                    var old = radarLayer;
                    map.removeLayer(old);
                }
                radarLayer = newLayer;
                var label = document.getElementById('timeLabel');
                var d = new Date(frame.time * 1000);
                label.textContent = (frame.isForecast ? 'Forecast ' : '') + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var host = data.host;
                    var past = (data.radar && data.radar.past) || [];
                    var nowcast = (data.radar && data.radar.nowcast) || [];
                    frames = past.map(function (f) {
                        return { url: host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', time: f.time, isForecast: false };
                    }).concat(nowcast.map(function (f) {
                        return { url: host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', time: f.time, isForecast: true };
                    }));

                    if (frames.length === 0) {
                        document.getElementById('timeLabel').textContent = 'Radar unavailable';
                        return;
                    }

                    frameIndex = frames.length - 1 - (nowcast.length > 0 ? 0 : 0);
                    frameIndex = past.length - 1 >= 0 ? past.length - 1 : 0;
                    showFrame(frameIndex);

                    timer = setInterval(function () {
                        frameIndex = (frameIndex + 1) % frames.length;
                        showFrame(frameIndex);
                    }, 600);
                })
                .catch(function () {
                    document.getElementById('timeLabel').textContent = 'Radar unavailable';
                });
        }
    </script>
</body>
</html>
