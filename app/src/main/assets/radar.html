<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #000; }
        #map {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
        }
        #statusLabel {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-family: sans-serif;
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="statusLabel">Starting…</div>

    <script>
        function setStatus(text) {
            var el = document.getElementById('statusLabel');
            if (el) el.textContent = text;
        }
        window.onerror = function (message, source, lineno, colno) {
            setStatus('JS error: ' + message + ' (' + lineno + ':' + colno + ')');
        };
        setStatus('Page loaded, waiting for coordinates…');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" onerror="setStatus('Failed to load Leaflet from CDN')"></script>
    <script>
        function initRadar(lat, lon) {
            try {
                if (typeof L === 'undefined') {
                    setStatus('Leaflet did not load (no internet or CDN blocked)');
                    return;
                }

                setStatus('Initializing map…');
                var map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat, lon], 7);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    subdomains: 'abc',
                    maxZoom: 19
                }).addTo(map);

                L.marker([lat, lon]).addTo(map);

                var radarLayer = null;
                var frames = [];
                var frameIndex = 0;

                function showFrame(i) {
                    var frame = frames[i];
                    if (!frame) return;
                    var newLayer = L.tileLayer(frame.url, { opacity: 0.75, zIndex: 10 });
                    newLayer.addTo(map);
                    if (radarLayer) {
                        map.removeLayer(radarLayer);
                    }
                    radarLayer = newLayer;
                    var d = new Date(frame.time * 1000);
                    setStatus((frame.isForecast ? 'Forecast ' : '') + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                }

                setStatus('Loading radar frames…');
                fetch('https://api.rainviewer.com/public/weather-maps.json')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        var host = data.host;
                        var past = (data.radar && data.radar.past) || [];
                        var nowcast = (data.radar && data.radar.nowcast) || [];
                        frames = past.map(function (f) {
                            return { url: host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', time: f.time, isForecast: false };
                        }).concat(nowcast.map(function (f) {
                            return { url: host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', time: f.time, isForecast: true };
                        }));

                        if (frames.length === 0) {
                            setStatus('Radar unavailable (no frames)');
                            return;
                        }

                        frameIndex = past.length > 0 ? past.length - 1 : 0;
                        showFrame(frameIndex);

                        setInterval(function () {
                            frameIndex = (frameIndex + 1) % frames.length;
                            showFrame(frameIndex);
                        }, 600);
                    })
                    .catch(function (err) {
                        setStatus('Radar frames failed to load: ' + err);
                    });
            } catch (e) {
                setStatus('initRadar error: ' + e);
            }
        }
    </script>
</body>
</html>
